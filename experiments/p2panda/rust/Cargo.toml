[package]
name = "creative-cooking-p2panda-spike"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
iroh-base = "=1.0.3"
iroh-gossip = "=0.101.0"
iroh-mdns-address-lookup = "=0.5.0"
p2panda = "=0.7.1"
p2panda-core = "=0.7.1"
p2panda-spaces = "=0.7.1"
p2panda-auth = "=0.7.1"
futures-util = "=0.3.32"
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }

# p2panda-net 0.7.1 uses Iroh 1.0.3. Direct transport versions pinned.
# Cargo.lock is generated by experimental CI; transitive versions must be committed.

[dev-dependencies]
p2panda-encryption = "=0.7.1"
p2panda-store = { version = "=0.7.1", features = ["sqlite", "spaces"] }
serde_json = "=1.0.154"
hex = "=0.4.3"
p2panda-spaces = { version = "=0.7.1", features = ["test_utils"] }

name: p2panda substrate spike (experimental)

on:
  pull_request:
    paths:
      - "experiments/p2panda/**"
      - "docs/spikes/local-first-p2panda.md"
      - ".github/workflows/p2panda-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-contract:
    name: Opaque contract and encrypted browser mailbox
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          package-manager-cache: false
      - run: node --test experiments/p2panda/*.test.mjs

  rust-native:
    name: Pinned p2panda native/space tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/p2panda/rust -> target
      - run: cargo test --manifest-path experiments/p2panda/rust/Cargo.toml --all-targets
      - name: Three isolated Rust processes / offline third-replica catch-up (best effort)
        continue-on-error: true
        timeout-minutes: 7
        run: |
          cargo build --manifest-path experiments/p2panda/rust/Cargo.toml --bin peer
          node experiments/p2panda/process-smoke.mjs experiments/p2panda/rust/target/debug/peer

  mobile-cross-check:
    name: Rust target check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-15
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    # Target-check failures should surface as evidence without breaking app CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - name: Configure Android NDK clang for Rust dependencies
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_NDK_HOME:-}" ]; then
            ndk="$ANDROID_NDK_HOME"
          else
            sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          ar="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          test -x "$clang" || { echo "Android NDK Clang missing at $clang" >&2; exit 1; }
          test -x "$ar"
          echo "CC_aarch64_linux_android=$clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang" >> "$GITHUB_ENV"
      - run: cargo check --manifest-path experiments/p2panda/rust/Cargo.toml --lib --target ${{ matrix.target }}

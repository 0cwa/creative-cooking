name: creative-cooking-sync-local
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: creative_cooking
      POSTGRES_USER: creative_cooking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - ./initdb/001_test_database.sql:/docker-entrypoint-initdb.d/001_test_database.sql:ro
    shm_size: 64mb
    tmpfs:
      - /var/lib/postgresql/data:rw,size=2147483648
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creative_cooking -d creative_cooking"]
      interval: 2s
      timeout: 3s
      retries: 30

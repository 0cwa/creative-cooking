[package]
name = "creative-cooking-automerge-jni"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "creative_cooking_automerge_jni"
crate-type = ["cdylib"]

[dependencies]
# Same pinned Automerge 3.5.0 core, not the Java 0.0.9 embedded core.
automerge = { path = "../../upstream-automerge/rust/automerge" }
jni = { version = "=0.21.1", default-features = false }
serde_json = "=1.0.145"

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'dev.creativecooking'
version = '0.0.1'

android {
  namespace 'expo.modules.subductionnative'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName "0.0.1"
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }
}

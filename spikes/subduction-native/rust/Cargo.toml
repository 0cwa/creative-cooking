[package]
name = "cc_subduction_native"
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cc-subduction-host-probe"
path = "src/bin/probe.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
hex = "0.4"
future_form = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.46", features = ["rt-multi-thread", "time", "macros", "net"] }
sedimentree_core = { path = "../../../subduction-upstream/sedimentree_core", features = ["std"] }
subduction_core = { path = "../../../subduction-upstream/subduction_core", features = ["std", "system_time"] }
subduction_crypto = { path = "../../../subduction-upstream/subduction_crypto", features = ["std"] }
subduction_websocket = { path = "../../../subduction-upstream/subduction_websocket", features = ["tokio_client_rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
